<path d="M415 205 Q 535 60 625 205 Z" fill="#D9922B" fill-opacity="0.28" stroke="#D9922B" stroke-width="1.5" style="fill:rgb(217, 146, 43);stroke:rgb(217, 146, 43);color:rgb(11, 11, 11);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

