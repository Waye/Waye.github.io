<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" role="img" aria-labelledby="t d">
<title id="t">人眼三种视锥细胞的响应曲线</title>
<desc id="d">短波、中波、长波三种视锥细胞在可见光谱上的响应曲线，峰值分别约在 420、534、564 纳米。中波与长波曲线大幅重叠，长波峰值落在黄绿区而非红色区。</desc>
<style>
  .lbl { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 12px; }
  .ax  { stroke: #b4b0a8; stroke-width: .8; }
  .tx  { fill: #57534c; }
  @media (prefers-color-scheme: dark) {
    .ax { stroke: #55514a; }
    .tx { fill: #a9a49b; }
  }
</style>

<line class="ax" x1="70" y1="262" x2="640" y2="262"/>

<path d="M70 178 C95 106 118 72 140 72 C176 72 216 192 250 246 C276 259 290 262 312 262"
      fill="none" stroke="#3B6FD4" stroke-width="2.2"/>
<path d="M150 262 C200 256 250 182 290 114 C310 82 325 72 340 72 C360 72 380 94 400 134 C440 214 490 254 540 262"
      fill="none" stroke="#2E9E4F" stroke-width="2.2"/>
<path d="M175 262 C230 252 280 192 320 124 C345 86 370 72 392 72 C420 72 450 104 480 154 C520 218 570 252 625 261"
      fill="none" stroke="#C7452F" stroke-width="2.2"/>

<text class="lbl" x="140" y="60" text-anchor="middle" fill="#3B6FD4">S · 约 420nm</text>
<text class="lbl" x="322" y="58" text-anchor="middle" fill="#2E9E4F">M · 约 534nm</text>
<text class="lbl" x="452" y="58" text-anchor="middle" fill="#C7452F">L · 约 564nm</text>

<rect x="70"  y="280" width="35" height="14" fill="#2A0A40"/>
<rect x="105" y="280" width="35" height="14" fill="#4B0082"/>
<rect x="140" y="280" width="35" height="14" fill="#3300CC"/>
<rect x="175" y="280" width="35" height="14" fill="#0000FF"/>
<rect x="210" y="280" width="35" height="14" fill="#0080FF"/>
<rect x="245" y="280" width="35" height="14" fill="#00D4D4"/>
<rect x="280" y="280" width="35" height="14" fill="#00E000"/>
<rect x="315" y="280" width="35" height="14" fill="#40E000"/>
<rect x="350" y="280" width="35" height="14" fill="#A0E000"/>
<rect x="385" y="280" width="35" height="14" fill="#E0E000"/>
<rect x="420" y="280" width="35" height="14" fill="#FFB000"/>
<rect x="455" y="280" width="35" height="14" fill="#FF6000"/>
<rect x="490" y="280" width="35" height="14" fill="#FF2000"/>
<rect x="525" y="280" width="52" height="14" fill="#E00000"/>
<rect x="577" y="280" width="55" height="14" fill="#900000"/>

<text class="lbl tx" x="105" y="314" text-anchor="middle">400</text>
<text class="lbl tx" x="280" y="314" text-anchor="middle">500</text>
<text class="lbl tx" x="455" y="314" text-anchor="middle">600</text>
<text class="lbl tx" x="630" y="314" text-anchor="middle">700</text>
<text class="lbl tx" x="350" y="338" text-anchor="middle">波长 nm　——　注意 L 的峰值在黄绿区，而且 M 与 L 大幅重叠</text>
</svg>
